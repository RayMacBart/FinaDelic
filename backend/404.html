<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="author" content="Reinhard Höbart"/>
   <meta name="copyright" content="Reinhard Höbart 2025"/>
   <meta name="description" content="FinaDelic - personal finance manager 404 Page."/>
   <!-- <script defer></script> -->
   <link rel="icon" type="image/svg+xml" href="./assets/FinaDelic Logo Hero.svg">
   <style>
      @font-face {
      font-family: "Inter";
      src: url("fonts/Inter/InterVariable.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      }
      @font-face {
      font-family: "Inter";
      src: url("fonts/Inter/InterVariable-Italic.ttf") format("truetype");
      font-weight: 100 900;
      font-style: italic;
      font-display: swap;
      }
      @font-face {
      font-family: "Commissioner";
      src: url("fonts/Commissioner/CommissionerVariable.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      }
      @font-face {
      font-family: "Commissioner";
      src: url("fonts/Commissioner/CommissionerVariable-Italic.ttf") format("truetype");
      font-weight: 100 900;
      font-style: italic;
      font-display: swap;
      }
      *, *::before, *::after {
      box-sizing: border-box;
      }

      * {
      margin: 0;
      padding: 0;
      font-size: 100%;
      vertical-align: baseline;
      cursor: default;
      }

      html {
      height: 100%;
      font-size: 1em;
      }
      @media (min-width: 576px) {
      html {
         font-size: 1.1em;
      }
      }
      @media (min-width: 768px) {
      html {
         font-size: 1.2em;
      }
      }
      @media (min-width: 992px) {
      html {
         font-size: 1.3em;
      }
      }
      @media (min-width: 1200px) {
      html {
         font-size: 1.4em;
      }
      }
      @media (min-width: 1400px) {
      html {
         font-size: 1.5em;
      }
      }

      body {
      height: 100%;
      -webkit-font-smoothing: antialiased;
      font-weight: 500;
      font-style: normal;
      font-family: "Inter", sans-serif;
      }
      @media (max-width: 768px) {
      body {
         min-height: 100dvh;
      }
      }

      ol, menu, ul {
      list-style: none;
      }

      strong {
      font-weight: inherit;
      }

      em {
      font-style: normal;
      }

      abbr {
      text-decoration-line: none;
      }

      a {
      cursor: pointer;
      }

      .view-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: #F7F8FD;
      }
      @media screen {
      @media (orientation: portrait) or (min-width: 992px) {
         .view-wrapper {
            min-height: 100%;
         }
      }
      }

      .page {
      flex-grow: 1;
      background: #F7F8FD;
      }
      .page--landing {
      background: linear-gradient(180deg, rgba(13, 26, 115, 0.5) 0%, rgba(213, 218, 246, 0.2) 11%, #F7F8FD 100%), #F7F8FD;
      }

      .margin-container {
      width: 70%;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      }
      @media (max-width: 1200px) {
      .margin-container {
         width: 75%;
      }
      }
      @media (max-width: 992px) {
      .margin-container {
         width: 80%;
      }
      }
      @media (max-width: 768px) {
      .margin-container {
         width: 85%;
      }
      }
      @media (max-width: 576px) {
      .margin-container {
         width: 90%;
      }
      }
      @media (max-width: 432px) {
      .margin-container {
         width: 95%;
      }
      }
      @media (max-width: 360px) {
      .margin-container {
         width: 98%;
      }
      }

      .loginBackButton-container {
      position: relative;
      width: 7rem;
      height: 4rem;
      margin-left: auto;
      text-align: center;
      }

      .loginBackButton {
      width: 3rem;
      background-image: url("./assets/loginBackButton.svg");
      height: 4rem;
      background-size: contain;
      background-repeat: none;
      z-index: 10;
      position: absolute;
      right: 0.7rem;
      top: 0.5rem;
      animation-name: hovershrink;
      animation-duration: 0.225s;
      }
      @media (min-width: 576px) {
      .loginBackButton {
         right: 3rem;
         top: 1.5rem;
      }
      .loginBackButton:hover {
         animation-name: hovergrow;
         animation-duration: 0.15s;
         animation-fill-mode: forwards;
         cursor: pointer;
      }
      @keyframes hovergrow {
         0% {
            width: 3rem;
            height: 4rem;
            right: 3rem;
            top: 1.5rem;
         }
         100% {
            width: 3.3rem;
            height: 4.4rem;
            right: 2.85rem;
            top: 1.3rem;
         }
      }
      @keyframes hovershrink {
         0% {
            width: 3.3rem;
            height: 4.4rem;
            right: 2.85rem;
            top: 1.3rem;
         }
         100% {
            width: 3rem;
            height: 4rem;
            right: 3rem;
            top: 1.5rem;
         }
      }
      }

      .compPage {
      color: rgb(0, 0, 35);
      margin: auto;
      font-family: "Commissioner", sans-serif;
      }
      .compPage__background {
      background-image: url("./assets/FinaDelic Logo Background.svg");
      background-size: contain;
      background-repeat: none;
      width: 20rem;
      height: 12rem;
      left: calc(50dvw - 10rem);
      top: calc(50dvh - 6rem);
      position: fixed;
      opacity: 0.33;
      z-index: 0;
      }
      @media (max-height: 500px) {
      .compPage__background {
         position: fixed;
         top: calc(100dvh - 15rem);
      }
      }
      @media (max-height: 399px) {
      .compPage__background {
         position: fixed;
         top: calc(100dvh - 12rem);
      }
      }
      @media (max-height: 359px) {
      .compPage__background {
         position: fixed;
         top: calc(100dvh - 10rem);
      }
      }
      .compPage__header-container {
      background-color: #FBF9F9;
      width: fit-content;
      border: 0.1rem solid #6B4747;
      border-radius: 0.6rem;
      padding: 0.7rem 1.3rem;
      text-align: center;
      font-size: 1.7rem;
      letter-spacing: 0.06rem;
      box-shadow: 0 0.09rem 0.343rem rgba(41, 44, 61, 0.3), 0 0 0.685rem rgba(107, 71, 71, 0.5) inset;
      }
      .compPage__appname {
      color: #273AB0;
      font-weight: 500;
      }
      .compPage__header {
      color: #2E1F1F;
      font-weight: 500;
      }
      .compPage__artwrap {
      width: 19.5rem;
      }
      .compPage__title {
      width: fit-content;
      font-size: 1.45rem;
      font-weight: 500;
      margin: 2.5rem auto 0.6rem auto;
      text-decoration: underline;
      }
      .compPage__paragraph {
      font-size: 1.1rem;
      line-height: 1.5rem;
      text-align: center;
      }
      .compPage__address-title {
      font-size: 1.2rem;
      font-weight: 550;
      text-decoration: underline;
      margin-top: 4rem;
      margin-bottom: 0.4rem;
      }
      .compPage__address {
      font-size: 1.2rem;
      font-weight: 420;
      font-style: normal;
      text-align: center;
      }

      .footer {
      height: 10rem;
      width: 100%;
      background: #F7F8FD;
      background-color: #424b89;
      box-shadow: 0 -1px 2px 0 rgba(61, 72, 143, 0.5), 0 0 10px 7px #5E6BBA inset;
      z-index: 2;
      }

      .footer__content-flexwrap {
      height: 10rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      }

      .footer__menu {
      display: flex;
      flex-direction: column;
      width: 13rem;
      align-items: flex-end;
      justify-content: space-between;
      padding: 1.5rem 0.2rem;
      position: relative;
      align-self: stretch;
      font-family: "Commissioner", Helvetica;
      font-weight: 400;
      font-size: 1rem;
      text-align: right;
      }
      @media (max-width: 500px) {
      .footer__menu {
         width: 9.4rem;
      }
      }
      @media (max-width: 420px) {
      .footer__menu {
         margin-left: -2rem;
      }
      }

      .footer__menu > li > a {
      color: #fbfbfe;
      text-decoration: none;
      }
      .footer__menu > li > a:hover, .footer__menu > li > a:active {
      animation-name: linkhover;
      animation-duration: 0.15s;
      animation-timing-function: ease-out;
      animation-fill-mode: forwards;
      }
      @keyframes linkhover {
      0% {
         font-weight: 400;
         text-decoration: none;
      }
      100% {
         font-weight: 500;
         text-decoration: underline;
      }
      }
      .footer-margin {
      height: 6rem;
      background: #F7F8FD;
      }
      .footer-margin--flowlist {
      background-color: #CDD2F4;
      box-shadow: 0 2rem 2rem #CDD2F4;
      }

      .footerLogoBox {
      background-image: url('./assets/FinaDelic Logo Footer.svg');
      padding: 1rem;
      width: 9rem;
      height: 4rem;
      overflow: visible;
      background-size: contain;
      cursor: pointer;
      }
   </style>
</head>

<body>
   <div class="view-wrapper">
      <div class="page">
         <nav class="loginBackButton-container">
            <a href="/">
               <div class="loginBackButton"></div>
            </a>
         </nav>
         <div class="compPage compPage__header-container">
            <h1 class="compPage compPage__appname">404</h1>
         </div>
         <div class="compPage compPage__background"></div>
         <div class="margin-container">
            <article class="compPage compPage__artwrap">
               <h2 class="compPage compPage__title">Page Not Found!</h2>
               <p class="compPage compPage__paragraph">The URL you requested doesn't exist. Please try another URL.</p>
            </article>
         </div>
         <div class="footer-margin"></div>
      </div>
      <footer class="footer">
         <div class="margin-container">
            <div class="footer__content-flexwrap">
               <a href="/">
                  <div class="footerLogoBox"></div>
               </a>
                  <!-- <img src="/public/assets/FinaDelic Logo Footer.svg"> -->
               <menu class="footer__menu">
                  <li class="footer-link"><a href="/terms">Terms &amp; Conditions</a></li>
                  <li class="footer-link"><a href="/privacy">Privacy Policy</a></li>
                  <li class="footer-link"><a href="/legal">Legal Notice</a></li>
               </menu>
            </div>
         </div>
      </footer>
   </div>
</body>
