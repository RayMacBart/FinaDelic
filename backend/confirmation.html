<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="author" content="Reinhard Höbart"/>
   <meta name="copyright" content="Reinhard Höbart 2025"/>
   <meta name="description" content="FinaDelic - Sign Up Confirmation"/>
   <meta http-equiv="cache-control" content="no-cache"/>   <!-- could make sense if caching is self handled within PWA or HTML is changed very frequently -->
   <title>FinaDelic Sign Up Confirmation</title>
   <link rel="icon" type="image/svg+xml" href="./assets/FinaDelic Logo Hero.svg">
   <style>
      @font-face {
         font-family: 'Commissioner';
         src: url('./CommissionerVariable.ttf') format('truetype');
         font-weight: 100 900;
         font-style: normal;
         font-display: swap;
      }


      *, *::before, *::after {
      box-sizing: border-box;
      }

      * {
      margin: 0;
      padding: 0;
      font-size: 100%;
      vertical-align: baseline;
      cursor: default;
      }


      html {
         height: 100%;
         font-size: 1em;
      }
      @media (min-width: 576px) {
         html {
         font-size: 1.1em;
         }
      }
      @media (min-width: 768px) {
         html {
         font-size: 1.2em;
         }
      }
      @media (min-width: 992px) {
         html {
         font-size: 1.3em;
         }
      }
      @media (min-width: 1200px) {
         html {
         font-size: 1.4em;
         }
      }
      @media (min-width: 1400px) {
         html {
         font-size: 1.5em;
         }
      }


      body {
         background: linear-gradient(180deg, rgba(13, 26, 115, 0.50) 0%, rgba(213, 218, 246, 0.20) 11%, #F7F8FD 100%);
         min-height: 100dvh;
         height: fit-content;
         background-attachment: fixed;
      }

      main {
         height: fit-content;
         margin-top: 7rem;
         text-align: center;
      }

      header {
         width: fit-content;
         height: 10rem;
         margin: 5rem auto 1.5rem auto;
         color: #273AB0;
         text-align: center;
      }

      img {
         width: 15rem;
      }

      h1 {
         margin-top: 3rem;
         font-family: 'Commissioner', sans-serif;
         font-weight: 600;
         font-size: 2rem;
         text-shadow: -0.08rem -0.08rem 0.08rem #F7F8FD, 0.08rem -0.08rem 0.08rem #F7F8FD,
                     -0.08rem 0.08rem 0.08rem #F7F8FD, 0.08rem 0.08rem 0.08rem #F7F8FD,
                     0 0.14rem 0.16rem rgba(14,20,63,0.4), 0.14rem 0 0.16rem rgba(14,20,63,0.4),
                     0 -0.14rem 0.16rem rgba(14,20,63,0.4), -0.14rem 0 0.16rem rgba(14,20,63,0.4);
         color: #273AB0;
      }

      p {
         margin-top: 4rem;
         font-family: 'Commissioner', sans-serif;
         font-weight: 500;
         font-size: 1.3rem;
         color: #091563;
      }
   </style>
</head>

<body>
   <header>
      <img src="./assets/FinaDelic Logo Nav.svg" alt="FinaDelic Logo">
      <h1>EMAIL VERIFICATION<br>SUCCESSFUL</h1>
   </header>
   <main>
      <p>Your account has been activated.</p>
   </main>
</body>
