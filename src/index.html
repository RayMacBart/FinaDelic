<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="author" content="Reinhard Höbart"/>
   <meta name="copyright" content="Reinhard Höbart 2025"/>
   <meta name="description" content="FinaDelic - personal finance manager. Easy to understand and super customizable. Design your own, best possible overview - and master your money like the pros!"/>
   <meta http-equiv="cache-control" content="no-cache"/>   <!-- could make sense if caching is self handled within PWA or HTML is changed very frequently -->
   <title>FinaDelic</title>
   <script type="module" src="./bundle.js" defer></script>
   <link rel="icon" type="image/svg+xml" href="./assets/FinaDelic Logo Hero.svg">
   <link rel="stylesheet" href="./main.css">
</head>

<body>
   <div class="view-wrapper">
      <div class="page"></div>
      <footer class="footer">
         <div class="margin-container">
            <div class="footer__content-flexwrap">
               <div class="footerLogoBox"></div>
               <menu class="footer__menu">
                  <li class="footer-link"><a id='terms-footerlink' href="#">Terms &amp; Conditions</a></li>
                  <li class="footer-link"><a href="#">Privacy Policy</a></li>
                  <li class="footer-link"><a href="#">Legal Notice</a></li>
               </menu>
            </div>
         </div>
      </footer>
   </div>
</body>



<template id="devMenu">
   <menu style="display: flex; flex-direction: column; justify-content: space-around; align-items: center; flex-grow: 1; background: #F7F8FD; line-height: 2.5rem; padding-top: 2rem;">
      <li id='HP-loggedout' style="font-family: Commissioner; font-size: 1.2rem; color: #273AB0; cursor: pointer;">Homepage Logged out</li>
      <li id='login-page' style="font-family: Commissioner; font-size: 1.2rem; color: #273AB0; cursor: pointer;">Login Page</li>
      <li id='HP-loggedin' style="font-family: Commissioner; font-size: 1.2rem; color: #273AB0; cursor: pointer;">Homepage Logged in</li>
      <li id='flow-page' style="font-family: Commissioner; font-size: 1.2rem; color: #273AB0; cursor: pointer;">Flowpage</li>
      <li id='chart-page' style="font-family: Commissioner; font-size: 1.2rem; color: #273AB0; cursor: pointer;">Chartpage</li>
      <li id='terms & conditions' style="font-family: Commissioner; font-size: 1.2rem; color: #273AB0; cursor: pointer;">Terms &amp; Conditions</li>
      <li id='privacy-policy' style="font-family: Commissioner; font-size: 1.2rem; color: #273AB0; cursor: pointer;">Privacy Policy</li>
      <li id='legal-notice' style="font-family: Commissioner; font-size: 1.2rem; color: #273AB0; cursor: pointer;">Legal Notice</li>
   </menu>
</template>



<template id="loggedoutHP">
   <nav class="nav"><img class="icon icon--login" src="./assets/login.svg" alt="login" /></nav>
   <div class="margin-container">
      <header class="header">
         <div class="heroLogoBox"></div>
         <button class="button button--call2action" type="button">SIGN IN  /  SIGN UP</button>
         <hgroup class="hero">
            <picture>
               <div class="hero__pic"></div>
               <source class="hero__pic--desktop" media="(min-width:992px)" srcset="assets/moneyplant_desktop.jpg" type="image/jpeg">
               <img class="hero__pic__img-layer" src="assets/empty.png" alt="plant prospering in money">
               <div class="hero__pic--desktop__overlay"></div>
            </picture>
            <h1 class="hero__title">Insight &nbsp;&nbsp;&nbsp;<br> through &nbsp;<br>adaptability</h1>
         </hgroup>
      </header>
      <main>
         <section><h3>Professional Service</h3><p>We don't fear any effort to serve your satisfaction.</p></section>
      </main>
   </div>
</template>



<template id="loginPage">
   <h1>LOGIN PAGE</h1>
</template>



<template id="loggedinHP">
   <h1>LOGGED IN HP</h1>
</template>



<template id="flowPage">
   <h1>FLOWPAGE</h1>
</template>



<template id="chartPage">
   <h1>CHARTPAGE</h1>
</template>



<template id="terms">
   <h1>TERMS & CONDITIONS</h1>
</template>



<template id="legal">
   <h1>LEGAL NOTICE</h1>
</template>



<template id="privacy">
   <h1>PRIVACY POLICY</h1>
</template>



</html>
