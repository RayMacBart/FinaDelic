<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="author" content="Reinhard Höbart"/>
   <meta name="copyright" content="Reinhard Höbart 2025"/>
   <meta name="description" content="FinaDelic - Password Reset"/>
   <meta http-equiv="cache-control" content="no-cache"/>   <!-- could make sense if caching is self handled within PWA or HTML is changed very frequently -->
   <title>FinaDelic Password Reset</title>
   <script src="./PWreset.js" defer></script>
   <link rel="icon" type="image/svg+xml" href="./assets/FinaDelic Logo Hero.svg">
   <link rel="stylesheet" href="./PWreset.css">
</head>

<body>
   <header>
      <img src="./FinaDelic Logo Nav.svg" alt="FinaDelic Logo">
      <h1>PASSWORD RESET</h1>
   </header>
   <main>
      <form>
         <label for="newPW">Enter your new password:</label>
         <input id="newPW" type="password">
         <label for="newPWrepeat">Please repeat:</label>
         <input id="newPWrepeat" type="password">
         <button>CONFIRM</button>
      </form>
      <div id="confirmation">Your password has been reset successfully!</div>
   </main>
</body>
